name: tests

on:
  push:
    branches: ["main", "atlas-stage0"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identities:
    name: identity suite (CPU, py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      # The suite is exact-arithmetic checks against a dense float64 reference,
      # so it wants CPU determinism, not a GPU.
      JAX_PLATFORMS: cpu
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      # datasets/ holds ~810 MB of committed par/tim files that the test suite
      # never reads -- it builds models from tests/fixtures/data/*.npz instead.
      # Excluding it keeps checkout to a few seconds.
      - uses: actions/checkout@v4
        with:
          # blob:none keeps the ~810 MB of committed par/tim blobs out of the
          # fetch as well as out of the working tree. The regression harness
          # still works: it only ever needs ATLAS/ blobs, which are local.
          filter: blob:none
          sparse-checkout: |
            ATLAS
            tests
            tools
            bench
            pyproject.toml
            README.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Install only what the likelihood core and the tests need. In
      # particular NOT enterprise-pulsar / pint-pulsar: those are required by
      # ATLAS.pulsar, which needs a tempo2 runtime, and which the suite never
      # imports. Regenerating fixtures is a local job (tools/make_fixtures.py).
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "jax[cpu]" numpy scipy numpyro joblib \
                                scikit-learn tqdm tqdm-joblib pytest

      - name: the likelihood core must import without jug, pint or tempo2
        run: |
          python - <<'PY'
          import ATLAS.data, ATLAS.model, ATLAS.model_builder
          import ATLAS.nMatrix.base, ATLAS.signals.factorized.base
          import ATLAS.signals.correlated.base, ATLAS.psd_functions
          print("core imports clean")
          PY

      - name: pytest
        run: pytest -q -m "not gpu and not slow and not golden and not needs_data"

      - name: identity margins
        run: python tools/measure_margins.py

      # NOTE: unverified until this workflow first runs -- git worktree inside a
      # shallow, blob-filtered, sparse checkout is the one step here that could
      # not be reproduced locally.
      - name: regression harness null test
        run: |
          git config user.email ci@example.com
          git config user.name CI
          python tools/regress.py --null --case ltm --case ltm-gtm
